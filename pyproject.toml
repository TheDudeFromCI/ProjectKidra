[project]
name = "project-kidra"
version = "0.1.0"
description = "Project Kidra: an experimental AI agent driven by emotional reasoning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "tokenizers", "tqdm"]

[project.optional-dependencies]
vector = ["chromadb"]
qwen = ["torch>=2.4", "transformers>=4.51,<5", "accelerate>=1.0", "safetensors>=0.4"]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "types-tqdm"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["project_kidra*"]

[tool.mypy]
strict = true
files = ["project_kidra", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[[tool.mypy.overrides]]
module = ["tokenizers", "tokenizers.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
project_kidra = ["py.typed", "assets/tokenizer.json"]
